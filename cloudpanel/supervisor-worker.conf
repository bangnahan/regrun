[program:regrun-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/{{user}}/htdocs/{{domain}}/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{user}}
numprocs=2
redirect_stderr=true
stdout_logfile=/home/{{user}}/htdocs/{{domain}}/storage/logs/worker.log
stopwaitsecs=3600
