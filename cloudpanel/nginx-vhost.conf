# ==============================================================================
# CloudPanel Nginx Virtual Host Configuration for Multi-Domain Laravel Application
# ==============================================================================
# Replace {{user}} and {{domain}} with your CloudPanel site values:
# Example: user = bangnahan, sitename = regrun.myagency.com
# Multi-Domain: In CloudPanel UI, add all your custom event domains in "Domain Names"
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # CloudPanel automatically injects SSL certificate directives here
    # ssl_certificate /etc/nginx/ssl-certificates/...;
    # ssl_certificate_key /etc/nginx/ssl-certificates/...;

    # The server_name is automatically updated by CloudPanel with all domain aliases:
    # server_name your-main-domain.com tiket.nusantararun.com reg.jakartamarathon.id *.your-agency.com;
    server_name $host;

    # Document Root (points to public directory of Laravel)
    root /home/{{user}}/htdocs/{{domain}}/public;
    index index.php index.html;

    # Character Set & Logs
    charset utf-8;
    access_log /var/log/nginx/{{domain}}_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/{{domain}}_error.log warn;

    # Upload size limit for event banners and bulk imports
    client_max_body_size 64M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ACME Challenge for Let's Encrypt SSL via CloudPanel
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
        default_type "text/plain";
    }

    # Static Assets Caching (Vite build / images / fonts)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|webp|woff|woff2|ttf|svg|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Block direct access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Primary Laravel Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Adjust PHP version as configured in CloudPanel (e.g. 8.2, 8.3, or 8.5)
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Critical Multi-Domain FastCGI parameters:
        # Passes the actual requested hostname to Laravel so Route & EventDomain matching works seamlessly!
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # Buffer & Timeout optimization for heavy API webhooks & exports
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }
}
